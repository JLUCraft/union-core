[package]
name = "identity"
version = "0.2.0"
edition = "2024"
publish = false

[dependencies]
wire = { path = "../wire" }
libp2p-identity = { version = "0.3", features = ["ed25519", "rand", "peerid"] }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
