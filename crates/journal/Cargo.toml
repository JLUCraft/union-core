[package]
name = "journal"
version = "0.2.0"
edition = "2024"
publish = false

[features]
consensus = ["dep:openraft", "dep:uuid"]

[dependencies]
uuid = { version = "1", features = ["v4"], optional = true }
protocol = { path = "../protocol" }
identity = { path = "../identity" }
state = { path = "../state" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
tempfile = "3"
openraft = { version = "=0.9.25", features = ["serde", "storage-v2"], optional = true }

[lints.rust]
unsafe_code = "forbid"
