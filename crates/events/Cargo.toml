[package]
name = "events"
version = "0.1.0"
edition = "2024"
publish = false
[dependencies]
node = { path = "../node" }
tokio = { version = "1", features = ["rt", "time", "sync", "fs"] }
state = { path = "../state" }
wire = { path = "../wire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[dev-dependencies]
identity = { path = "../identity" }
authority = { path = "../authority" }
tempfile = "3"
[lints.rust]
unsafe_code = "forbid"
