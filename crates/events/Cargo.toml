[package]
name = "events"
version = "0.1.0"
edition = "2024"
publish = false
[features]
documents = ["dep:node", "dep:tokio"]
[dependencies]
league = { path = "../league" }
node = { path = "../node", optional = true }
tokio = { version = "1", features = ["rt", "time", "sync", "fs"], optional = true }
state = { path = "../state" }
protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[dev-dependencies]
identity = { path = "../identity" }
authority = { path = "../authority" }
tempfile = "3"
[lints.rust]
unsafe_code = "forbid"
