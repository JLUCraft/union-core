[package]
name = "llm-gateway"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
futures = "0.3"
reqwest = { version = "0.13", features = ["json", "stream"] }

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
tempfile = "3"
