[package]
name = "authority"
version = "0.2.0"
edition = "2024"
publish = false

[features]
consensus = ["dep:openraft", "journal/consensus"]

[dependencies]
wire = { path = "../wire" }
identity = { path = "../identity" }
state = { path = "../state" }
node = { path = "../node" }
journal = { path = "../journal" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "signal"] }
openraft = { version = "=0.9.25", features = ["serde", "storage-v2"], optional = true }
futures = "0.3"
tracing = "0.1"

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
tempfile = "3"
