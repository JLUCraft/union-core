syntax = "proto3";
package jlucraft.union.v1;

// Each control frame is u32 big-endian byte length + protobuf, at most 65536 bytes.
// After OpenResponse(ACCEPTED), the same stream carries opaque service bytes.
// These definitions mirror src/protocol.rs (prost derives).
message DirectoryRequest {}
message ServiceRecord {
  string id = 1;
  string name = 2;
  string protocol = 3;
}
message DirectoryResponse { repeated ServiceRecord services = 1; }
message OpenRequest {
  string service_id = 1;
  GrantEnvelope grant = 2;
  bytes student = 3; // JSON StudentPresentation; exact nested signed payload bytes
}
enum Status {
  UNSPECIFIED = 0;
  ACCEPTED = 1;
  DENIED = 2;
  NOT_FOUND = 3;
  BUSY = 4;
}
message OpenResponse { Status status = 1; }
message GrantClaims {
  string id = 1;
  bytes subject = 2; // libp2p PeerId bytes, checked against authenticated connection
  bytes audience = 3; // destination node, never the intermediate relay
  string service_id = 4;
  uint64 not_before = 5; // Unix seconds, inclusive
  uint64 expires_at = 6; // Unix seconds, exclusive
}
message GrantEnvelope {
  bytes claims = 1; // exact signed bytes; do not decode/re-encode before verifying
  bytes issuer_key = 2; // libp2p protobuf public key
  bytes signature = 3; // signature over UTF8("jlucraft/union/grant/1\0") + claims
}
