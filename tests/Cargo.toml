[package]
name = "union-tests"
version = "0.2.0"
edition = "2024"
publish = false

[features]
consensus = ["authority/consensus"]

[dependencies]
league = { path = "../crates/league" }
authority = { path = "../crates/authority" }
journal = { path = "../crates/journal" }
node = { path = "../crates/node" }
client = { path = "../crates/client", features = ["documents"] }
identity = { path = "../crates/identity" }
state = { path = "../crates/state" }
events = { path = "../crates/events" }
protocol = { path = "../crates/protocol" }

[dev-dependencies]
serde_json = "1"
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "signal"] }
tempfile = "3"
openraft = { version = "=0.9.25", features = ["serde", "storage-v2"] }

[lints.rust]
unsafe_code = "forbid"
