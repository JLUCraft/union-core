[package]
name = "union-core"
version = "0.2.0"
edition = "2024"
publish = false

[features]
consensus = ["dep:openraft"]

[dependencies]
openraft = { version = "=0.9.25", features = ["serde", "storage-v2"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
futures = "0.3"
libp2p = { version = "0.56", features = ["tokio", "tcp", "quic", "noise", "yamux", "identify", "ping", "relay", "dcutr", "macros", "kad", "mdns", "autonat", "dns"] }
libp2p-stream = "=0.4.0-alpha"
prost = "0.14"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "signal"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"


[workspace]
